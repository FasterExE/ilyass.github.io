<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ILYASS SERVER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-image: url('images/background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 1cm);
            margin: 0;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #e6a700;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }
        p {
            font-size: 24px;
            margin-top: 0;
            line-height: 1.5;
            color: #ffffff;
        }
        a {
            text-decoration: none;
            color: #fff;
            transition: color 0.3s;
        }
        a:hover {
            color: #fff;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        .telegram-button {
            background-color: #0088CC;
        }
        .telegram-button:hover {
            background-color: #0077B5;
        }
        .whatsapp-button {
            background-color: #25D366;
        }
        .whatsapp-button:hover {
            background-color: #128C7E;
        }
        .facebook-button {
            background-color: #3b5998;
        }
        .facebook-button:hover {
            background-color: #2d4373;
        }
        .instagram-button {
            background-color: #E4405F;
        }
        .instagram-button:hover {
            background-color: #D81B60;
        }
        .github-button {
            background-color: #333;
        }
        .github-button:hover {
            background-color: #6e5494;
        }
        .icon {
            font-size: 24px;
            margin-right: 5px;
        }
        .button-pair {
            display: inline-block;
            margin: 10px;
        }
    </style>
    <script>
        document.addEventListener("copy", function (e) {
            e.preventDefault();
            alert("نسخ النص ممنوع!");
        });

        document.addEventListener("cut", function (e) {
            e.preventDefault();
            alert("قص النص ممنوع!");
        });
    </script>
</head>
<body>
    <div class="container">
        <h1 style="color: #ffffff;">ILYASS SERVER</h1>
        
        <!-- إضافة الصورة الدائرية -->
        <img src="images/profile.jpg" alt="Profile" class="profile-img">
        
        <p>Fast and stable servers developed by ILYASS NAJHI. 100% Moroccan.</p>

        <!-- زر واتساب وتلجرام -->
        <div class="button-pair">
            <a class="telegram-button button" href="https://t.me/IlyassExE"><i class="fab fa-telegram-plane icon"></i> Telegram</a>
            <a class="whatsapp-button button" href="https://wa.me/+41762298622"><i class="fab fa-whatsapp icon"></i> WhatsApp</a>
        </div>
        
        <!-- زر فيسبوك وإنستجرام -->
        <div class="button-pair">
            <a class="instagram-button button" href="https://www.instagram.com/ilyass.dev"><i class="fab fa-instagram icon"></i> Instagram</a>
            <a class="facebook-button button" href="https://www.facebook.com/najhi.ilyass"><i class="fab fa-facebook-f icon"></i> Facebook</a>
        </div>
        
        <a class="github-button button" href="https://github.com/FasterExE"><i class="fab fa-github icon"></i> GitHub</a>

        <footer style="text-align: center; background-color: ; color: #fff; padding: 10px;">
            &copy; 2024 ILYASS DEV
        </footer>
    </div>
</body>
</html>
