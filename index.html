<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FASTER CFG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-image: url('images/background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 1cm);
            margin: 0;
            font-family: Arial, sans-serif;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #e6a700;
        }
        p {
            font-size: 24px;
            margin-top: 0;
            line-height: 1.5;
            color: #ffffff;
        }
        a {
            text-decoration: none;
            color: #fff;
            transition: color 0.3s;
        }
        a:hover {
            color: #fff;
        }
        .telegram-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #0088CC;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .telegram-button:hover {
            background-color: #0077B5;
        }
        .whatsapp-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #25D366;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .whatsapp-button:hover {
            background-color: #128C7E;
        }
        .telegram-icon {
            font-size: 24px;
            margin-right: 5px;
        }
        .whatsapp-icon {
            font-size: 24px;
            margin-right: 5px;
        }
        .github-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            border-radius: 5px;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .github-button:hover {
            background-color: #6e5494;
        }
    </style>
    <script>
        document.addEventListener("copy", function (e) {
            e.preventDefault();
            alert("نسخ النص ممنوع!");

            alert("قص النص ممنوع!");

</head>

    <div class="container">

        <a class="whatsapp-button" href="https://wa.me/+212631945709"><i class="fab fa-whatsapp whatsapp-icon"></i> WhatsApp</a>
        <a class="github-button" href="https://github.com/FasterExE"><i class="fab fa-github"></i> GitHub</a>
